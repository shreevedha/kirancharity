<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SabPaisa Payment Gateway Test Suite — Kiran Charitable Trust</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #dc2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3a8a, #1d4ed8);
            color: white;
            padding: 24px 32px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            margin-top: 8px;
            font-weight: 600;
        }

        .content {
            padding: 32px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--primary);
            border-bottom: 2px solid #eff6ff;
            padding-bottom: 8px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 640px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
        }

        input, select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.1);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .btn {
            flex: 1;
            padding: 12px 20px;
            border-radius: 8px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background-color: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-secondary {
            background-color: #e0e7ff;
            color: var(--primary);
        }

        .btn-secondary:hover {
            background-color: #c7d2fe;
        }

        .log-box {
            background: #0f172a;
            color: #38bdf8;
            padding: 16px;
            border-radius: 8px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #1e293b;
        }

        .status-pill {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;

        }

        .status-success { background: #dcfce7; color: #15803d; }
        .status-error { background: #fee2e2; color: #b91c1c; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>SabPaisa PG Integration Test Suite</h1>
        <p>Canara Bank Trust Account Integration (CM Nagar Branch, Guntur)</p>
        <span class="badge">ENVIRONMENT: STAGING (PG 3.0)</span>
    </div>

    <div class="content">
        <div class="section-title">1. Merchant Credentials</div>
        <div class="grid">
            <div class="form-group">
                <label for="merchantId">Merchant ID / Client Code</label>
                <input type="text" id="merchantId" value="SQUA102">
            </div>
            <div class="form-group">
                <label for="apiKey">API Key (X-Api-Key)</label>
                <input type="text" id="apiKey" value="sp_itOrld7Rm0SGjkqg_VSEXBtZXqi8T26-pMPfpUCxUQo">
            </div>
            <div class="form-group full">
                <label for="secretKey">Secret Key / Checksum Key</label>
                <input type="text" id="secretKey" value="sec_lLao-1-yDLmV81YjExxgR00a8o7FgJ8-HLSJj9Od4hY">
            </div>
            <div class="form-group full">
                <label for="baseUrl">SabPaisa API Base URL</label>
                <input type="text" id="baseUrl" value="https://staging-sb-merchant-api.sabpaisa.in">
            </div>
        </div>

        <div class="section-title">2. Test Donor Details</div>
        <div class="grid">
            <div class="form-group">
                <label for="payerName">Payer Full Name</label>
                <input type="text" id="payerName" value="SHAIK FAYAZ">
            </div>
            <div class="form-group">
                <label for="payerMobile">Payer Mobile Number</label>
                <input type="text" id="payerMobile" value="7702468889">
            </div>
            <div class="form-group">
                <label for="payerEmail">Payer Email Address</label>
                <input type="text" id="payerEmail" value="Fayaz.bodega@gmail.com">
            </div>
            <div class="form-group">
                <label for="amount">Donation Amount (INR)</label>
                <input type="number" id="amount" value="10">
            </div>
            <div class="form-group full">
                <label for="returnUrl">Return / Callback URL</label>
                <input type="text" id="returnUrl" value="https://kiran-charitable-trust.vercel.app/api/donations/sabpaisa-callback">
            </div>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="initiatePaymentDirect()">⚡ Test via SabPaisa Direct API</button>
            <button class="btn btn-secondary" onclick="initiatePaymentBackend()">🌐 Test via Vercel Backend API</button>
        </div>

        <div class="section-title">3. Response Log</div>
        <div class="log-box" id="logBox">System initialized. Click any test button above to execute payment initiation.</div>
    </div>
</div>

<script>
    function log(msg) {
        const box = document.getElementById('logBox');
        const timestamp = new Date().toLocaleTimeString();
        box.innerText = `[${timestamp}] ` + (typeof msg === 'object' ? JSON.stringify(msg, null, 2) : msg) + '\n\n' + box.innerText;
    }

    async function initiatePaymentDirect() {
        log('Starting Direct SabPaisa API test...');

        const merchantId = document.getElementById('merchantId').value.trim();
        const apiKey = document.getElementById('apiKey').value.trim();
        const secretKey = document.getElementById('secretKey').value.trim();
        const baseUrl = document.getElementById('baseUrl').value.trim();
        const customerName = document.getElementById('payerName').value.trim();
        const customerMobile = document.getElementById('payerMobile').value.trim();
        const customerEmail = document.getElementById('payerEmail').value.trim();
        const amount = Number(document.getElementById('amount').value);
        const returnUrl = document.getElementById('returnUrl').value.trim();

        const timestamp = Math.floor(Date.now() / 1000).toString();
        const merchantTxnId = 'TEST-' + Date.now();

        // Checksum String: merchantId|merchantTxnId|amount|currency|timestamp
        const rawString = `${merchantId}|${merchantTxnId}|${amount}|INR|${timestamp}`;
        const checksum = CryptoJS.HmacSHA256(rawString, secretKey).toString(CryptoJS.enc.Hex);

        log({
            step: '1. Checksum & Request Construction',
            rawString,
            checksum,
            timestamp,
            merchantTxnId
        });

        const payload = {
            merchantId,
            merchantTxnId,
            amount,
            currency: 'INR',
            returnUrl,
            customerName,
            customerEmail,
            customerMobile,
            timestamp,
            checksum
        };

        try {
            log('Sending POST to ' + baseUrl + '/api/v2/payments ...');
            const res = await fetch(`${baseUrl}/api/v2/payments`, {
                method: 'POST',
                headers: {
                    'X-Api-Key': apiKey,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            });

            const data = await res.json();
            log({ step: '2. SabPaisa API Response Received', status: res.status, data });

            if (data.success && data.checkoutUrl && data.clientSecret) {
                const fullCheckoutUrl = `${data.checkoutUrl}?clientSecret=${data.clientSecret}`;
                log({ step: '3. Success! Opening SabPaisa Gateway Portal:', checkoutUrl: fullCheckoutUrl });
                setTimeout(() => {
                    window.open(fullCheckoutUrl, '_blank');
                }, 1000);
            } else {
                log({ step: 'API Error', error: data });
            }
        } catch (err) {
            log({ step: 'Network Exception', error: err.message });
        }
    }

    async function initiatePaymentBackend() {
        log('Starting Vercel Backend API test...');
        const customerName = document.getElementById('payerName').value.trim();
        const customerMobile = document.getElementById('payerMobile').value.trim();
        const customerEmail = document.getElementById('payerEmail').value.trim();
        const amount = Number(document.getElementById('amount').value);

        try {
            const res = await fetch('/api/donations/initiate-sabpaisa', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    fullName: customerName,
                    mobile: customerMobile,
                    email: customerEmail,
                    address: 'Guntur, AP',
                    amount: amount,
                    purpose: 'General Donation Test'
                })
            });

            const data = await res.json();
            log({ step: 'Vercel Backend Response', status: res.status, data });

            if (data.success && data.checkoutUrl) {
                log({ step: 'Opening SabPaisa Portal via Backend checkoutUrl:', checkoutUrl: data.checkoutUrl });
                setTimeout(() => {
                    window.open(data.checkoutUrl, '_blank');
                }, 1000);
            }
        } catch (err) {
            log({ step: 'Backend API Error', error: err.message });
        }
    }
</script>
</body>
</html>
